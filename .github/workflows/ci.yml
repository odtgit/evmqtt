name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - LICENSE
      - 'README.*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/check_version.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests
      - run: ruff format --check src tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Core installs and imports without the mqtt extra
        run: |
          pip install -e .
          python -c "import evmqtt.core, importlib.util as u; assert u.find_spec('paho') is None"
      - run: pip install mypy
      - run: mypy src/evmqtt/core

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[mqtt,dev]"
      - run: pytest -q -m "not broker and not uinput" --cov=evmqtt --cov-report=term-missing --cov-fail-under=89

  uinput:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo modprobe uinput
      - run: pip install -e ".[mqtt,dev]"
      - run: sudo -E env "PATH=$PATH" EVMQTT_REQUIRE_UINPUT=1 python -m pytest -q -p no:cacheprovider -m uinput

  broker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y mosquitto
      - run: sudo systemctl stop mosquitto || true
      - run: sudo systemctl disable mosquitto || true
      - run: pip install -e ".[mqtt,dev]"
      - run: pytest -q -m broker

  images-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/images.yml
    with:
      ref: ${{ github.sha }}
      push: false

  images-master:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      ref: ${{ github.sha }}
      push: true
