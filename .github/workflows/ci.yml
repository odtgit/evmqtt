name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build standalone image
        run: docker build --build-arg BUILD_FROM=python:3.12-alpine3.18 -t evmqtt:standalone .

      - name: Smoke test standalone image
        run: |
          docker run --rm evmqtt:standalone evmqtt --help
          status=0
          docker run --rm evmqtt:standalone evmqtt --list-devices || status=$?
          test "$status" -eq 1

      - name: Build Home Assistant add-on image (amd64)
        run: docker build -t evmqtt:ha-amd64 .

      - name: Smoke test Home Assistant add-on image
        run: |
          docker run --rm evmqtt:ha-amd64 evmqtt --help
          status=0
          docker run --rm evmqtt:ha-amd64 evmqtt --list-devices || status=$?
          test "$status" -eq 1

      - name: Stage add-on manifest for linting
        run: |
          mkdir -p .addon-lint-stage/translations
          cp config.yaml build.yaml .addon-lint-stage/
          cp translations/en.yaml .addon-lint-stage/translations/

      - uses: frenck/action-app-linter@v2.21.1
        with:
          path: "./.addon-lint-stage"
