name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q -m "not broker and not uinput" --cov=evmqtt --cov-report=term-missing --cov-fail-under=89

  uinput:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo modprobe uinput || true
      - name: Allow the runner user to open uinput and event nodes
        run: |
          printf '%s\n' \
            'KERNEL=="uinput", MODE="0666"' \
            'SUBSYSTEM=="input", KERNEL=="event*", MODE="0666"' \
            | sudo tee /etc/udev/rules.d/99-evmqtt-ci.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger
      - run: sudo chmod 0666 /dev/uinput || true
      - run: pip install -e ".[dev]"
      - name: Debug input device state
        if: always()
        run: |
          ls -l /dev/uinput || true
          ls -l /dev/input || true
          udevadm info -q all -n /dev/uinput || true
      - name: Run uinput tier (retry as root if permissions still block it)
        run: |
          if EVMQTT_REQUIRE_UINPUT=1 python -m pytest -q -m uinput; then
            exit 0
          fi
          echo "::warning::uinput tier failed as the runner user, retrying as root"
          sudo -E env "PATH=$PATH" EVMQTT_REQUIRE_UINPUT=1 python -m pytest -q -m uinput

  broker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y mosquitto
      - run: sudo systemctl stop mosquitto || true
      - run: sudo systemctl disable mosquitto || true
      - run: pip install -e ".[dev]"
      - run: pytest -q -m broker

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --build-arg BUILD_FROM=python:3.11-alpine -t evmqtt:ci .
