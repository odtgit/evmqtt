name: Images

on:
  workflow_call:
    inputs:
      ref:
        description: git ref to build (branch, tag, or sha)
        required: true
        type: string
      push:
        description: push images to ghcr.io and merge the multi-arch manifest
        required: true
        type: boolean
      version:
        description: semver to tag (e.g. 2.2.0); tags edge instead when empty and push is true
        required: false
        type: string
        default: ""
      move_latest:
        description: also move the :latest tag to this build (ignored unless version is set)
        required: false
        type: boolean
        default: true
      allow_overwrite:
        description: allow replacing an existing :version tag in the registry
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-26.04-arm
    steps:
      -
        name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >>"${GITHUB_ENV}"
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=edge,enable=${{ inputs.push && inputs.version == '' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' && inputs.move_latest }}
            type=raw,value=local,enable=${{ !inputs.push }}
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        # fork PRs get a read-only GITHUB_TOKEN, so only log in when actually pushing
        name: Login to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build (local load)
        if: ${{ !inputs.push }}
        id: build-local
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            BUILD_NAME=${{ github.event.repository.name }}
            BUILD_DESCRIPTION=${{ github.event.repository.description }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          tags: evmqtt:${{ env.PLATFORM_PAIR }}
      -
        name: Build and push by digest
        if: inputs.push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            BUILD_NAME=${{ github.event.repository.name }}
            BUILD_DESCRIPTION=${{ github.event.repository.description }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      -
        name: Smoke test (local image)
        if: ${{ !inputs.push }}
        run: |
          image="evmqtt:${{ env.PLATFORM_PAIR }}"
          docker run --rm "${image}" evmqtt --help
          status=0
          docker run --rm "${image}" evmqtt --list-devices || status=$?
          test "${status}" -eq 1
      -
        name: Smoke test
        if: inputs.push
        run: |
          image="${{ env.REGISTRY_IMAGE }}@${{ steps.build.outputs.digest }}"
          docker run --rm "${image}" evmqtt --help
          status=0
          docker run --rm "${image}" evmqtt --list-devices || status=$?
          test "${status}" -eq 1
      -
        name: Lint HA configuration
        if: matrix.platform == 'linux/amd64'
        uses: frenck/action-app-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: "."
      -
        name: Export digest
        if: inputs.push
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      -
        name: Upload digest
        if: inputs.push
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: inputs.push
    runs-on: ubuntu-latest
    needs:
      - image-build
    strategy:
      fail-fast: true
    steps:
      -
        name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=edge,enable=${{ inputs.version == '' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' && inputs.move_latest }}
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Refuse to overwrite an existing version tag
        if: ${{ inputs.version != '' && !inputs.allow_overwrite }}
        run: |
          if docker buildx imagetools inspect "${{ env.REGISTRY_IMAGE }}:${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::${{ env.REGISTRY_IMAGE }}:${{ inputs.version }} already exists; re-run with allow_overwrite to replace it"
            exit 1
          fi
      -
        name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)
      -
        name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
