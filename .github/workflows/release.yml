name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      republish_tag:
        description: re-publish an existing tag (vX.Y.Z) instead of computing a new one
        required: false
        type: string
      bump:
        description: force this bump level instead of analysing commits (ignored if republish_tag is set)
        required: false
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      force_overwrite_image:
        description: allow republish to overwrite an existing GHCR version tag (ignored unless republish_tag is set)
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.republish_tag == '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.compute.outputs.version }}
      release: ${{ steps.compute.outputs.release }}
      retag_only: ${{ steps.compute.outputs.retag_only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - id: compute
        env:
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail
          retag=$(python scripts/release.py pending-retag)
          if [ -n "$retag" ]; then
            echo "master's tip is an untagged release commit; only re-tagging"
            echo "version=$retag" >>"$GITHUB_OUTPUT"
            echo "release=true" >>"$GITHUB_OUTPUT"
            echo "retag_only=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "retag_only=false" >>"$GITHUB_OUTPUT"
          if [ -n "$BUMP" ] && [ "$BUMP" != "auto" ]; then
            version=$(python scripts/release.py forced-version "$BUMP")
          else
            version=$(python scripts/release.py next-version)
          fi
          if [ -n "$version" ]; then
            echo "version=$version" >>"$GITHUB_OUTPUT"
            echo "release=true" >>"$GITHUB_OUTPUT"
          else
            echo "release=false" >>"$GITHUB_OUTPUT"
          fi

  prepare:
    needs: version
    if: needs.version.outputs.release == 'true' && needs.version.outputs.retag_only == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.diff.outputs.base_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - id: diff
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "base_sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          python scripts/release.py apply "$VERSION"
          git diff > release.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-patch
          path: |
            release.patch
            RELEASE_NOTES.md
          retention-days: 1

  validate-and-push:
    needs: [version, prepare]
    if: |
      always() &&
      needs.version.outputs.release == 'true' &&
      (needs.version.outputs.retag_only == 'true' || needs.prepare.result == 'success')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      tag: v${{ needs.version.outputs.version }}
      version: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout with the release deploy key
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Verify master has not moved since version was computed
        if: needs.version.outputs.retag_only == 'false'
        env:
          EXPECTED_BASE: ${{ needs.prepare.outputs.base_sha }}
        run: |
          set -euo pipefail
          current=$(git rev-parse HEAD)
          if [ "$current" != "$EXPECTED_BASE" ]; then
            echo "::error::master moved since version was computed ($EXPECTED_BASE -> $current); failing this run so the next push recomputes from the new tip"
            exit 1
          fi

      - name: Verify HEAD is still the expected untagged release commit
        if: needs.version.outputs.retag_only == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          subject=$(git log -1 --format=%s)
          email=$(git log -1 --format=%ae)
          expected="release: ${VERSION} [skip ci]"
          if [ "$subject" != "$expected" ] || [ "$email" != "evmqtt-release-bot@users.noreply.github.com" ]; then
            echo "::error::master's tip is no longer the expected untagged release commit; failing, a later push will re-evaluate"
            exit 1
          fi

      - name: Download release patch
        if: needs.version.outputs.retag_only == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-patch
          path: /tmp/release-patch

      # Trust boundary: everything above this step (release.py, apply, the
      # patch content) ran in the read-only "prepare" job. This job holds
      # the push credential, so before it applies anything, it independently
      # re-checks - with plain shell against the raw diff text, not by
      # running repo code - that the patch only touches the version/
      # changelog fields it's supposed to.
      - name: Validate the patch only touches version/changelog fields
        if: needs.version.outputs.retag_only == 'false'
        run: |
          set -euo pipefail
          patch=/tmp/release-patch/release.patch
          files=$(grep -E '^\+\+\+ b/' "$patch" | sed 's#^+++ b/##' | sort -u)
          allowed=$(printf '%s\n' pyproject.toml config.yaml CHANGELOG.md custom_components/evmqtt/manifest.json | sort)
          bad_files=$(comm -23 <(printf '%s\n' "$files") <(printf '%s\n' "$allowed"))
          if [ -n "$bad_files" ]; then
            echo "::error::patch touches files outside the version/changelog set: $bad_files"
            exit 1
          fi

          hunk_lines() {
            awk -v f="$1" '
              $0 ~ ("^diff --git a/" f " ") { inblock=1; next }
              /^diff --git / { inblock=0 }
              inblock && /^[+-]/ && $0 !~ /^(\+\+\+|---)/ { print }
            ' "$patch"
          }

          # Format-agnostic: every changed line in these files must mention
          # "version" or the evmqtt== pin, and normalising away X.Y.Z digits
          # must make the removed and added line sets identical, i.e. only
          # version numbers changed, nothing else about the line did.
          check_version_only_file() {
            f="$1"
            lines=$(hunk_lines "$f")
            [ -n "$lines" ] || return 0
            off_scope=$(printf '%s\n' "$lines" | grep -viE 'version|evmqtt==' || true)
            if [ -n "$off_scope" ]; then
              echo "::error::unexpected $f hunk outside version/pin scope: $off_scope"
              exit 1
            fi
            removed=$(printf '%s\n' "$lines" | grep '^-' | cut -c2- | sed -E 's/[0-9]+\.[0-9]+\.[0-9]+/X.Y.Z/g' | sort)
            added=$(printf '%s\n' "$lines" | grep '^+' | cut -c2- | sed -E 's/[0-9]+\.[0-9]+\.[0-9]+/X.Y.Z/g' | sort)
            if [ "$removed" != "$added" ]; then
              echo "::error::$f hunk changes more than just version numbers"
              exit 1
            fi
          }

          for f in pyproject.toml config.yaml custom_components/evmqtt/manifest.json; do
            if printf '%s\n' "$files" | grep -qx "$f"; then
              check_version_only_file "$f"
            fi
          done

          if printf '%s\n' "$files" | grep -qx CHANGELOG.md; then
            bad=$(hunk_lines CHANGELOG.md | grep '^-' || true)
            [ -z "$bad" ] || { echo "::error::CHANGELOG.md patch contains deletions, only additions at the top are allowed"; exit 1; }
          fi

      - name: Apply, commit and push
        if: needs.version.outputs.retag_only == 'false'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git apply /tmp/release-patch/release.patch
          git config core.hooksPath /dev/null
          git config user.name "evmqtt-release[bot]"
          git config user.email "evmqtt-release-bot@users.noreply.github.com"
          git add pyproject.toml config.yaml CHANGELOG.md
          if [ -f custom_components/evmqtt/manifest.json ]; then
            git add custom_components/evmqtt/manifest.json
          fi
          git commit -m "release: ${VERSION} [skip ci]"
          git push origin HEAD:master

      - name: Tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config core.hooksPath /dev/null
          if git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} already exists, nothing to tag"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "release v${VERSION} already exists, nothing to do"
            exit 0
          fi
          notes=/tmp/release-patch/RELEASE_NOTES.md
          if [ -f "$notes" ]; then
            gh release create "v${VERSION}" --notes-file "$notes" --latest
          else
            gh release create "v${VERSION}" --notes "release: v${VERSION}" --latest
          fi

  manual:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.republish_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - id: resolve
        env:
          TAG: ${{ github.event.inputs.republish_tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::republish_tag must be vX.Y.Z"; exit 1; }
          git fetch origin master --quiet
          git rev-parse "refs/tags/$TAG" >/dev/null 2>&1 || { echo "::error::tag $TAG does not exist"; exit 1; }
          git merge-base --is-ancestor "$TAG" origin/master || { echo "::error::$TAG is not an ancestor of origin/master"; exit 1; }
          version="${TAG#v}"
          sha=$(git rev-parse "$TAG")
          if ! python scripts/release.py verify-release-commit "$sha" "$version"; then
            echo "::error::$TAG's commit is not a 'release: $version [skip ci]' commit by the release identity"
            exit 1
          fi
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"

  build:
    needs: [validate-and-push, manual]
    if: always() && (needs.validate-and-push.result == 'success' || needs.manual.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.validate-and-push.outputs.tag || needs.manual.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: python scripts/check_version.py "$TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
          retention-days: 7

  images:
    needs: [validate-and-push, manual]
    if: always() && (needs.validate-and-push.result == 'success' || needs.manual.result == 'success')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      ref: ${{ needs.validate-and-push.outputs.tag || needs.manual.outputs.tag }}
      push: true
      version: ${{ needs.validate-and-push.outputs.version || needs.manual.outputs.version }}
      move_latest: ${{ needs.manual.result != 'success' }}
      allow_overwrite: ${{ needs.manual.result == 'success' && github.event.inputs.force_overwrite_image == 'true' }}

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
