name: "evmqtt"
description: "Linux input event to MQTT gateway for Home Assistant with auto-discovery"
version: "2.1.0"
slug: "evmqtt"
homeassistant: "2024.12.0"
image: ghcr.io/odtgit/evmqtt
url: "https://github.com/odtgit/evmqtt"
arch:
  - amd64
  - aarch64
startup: "system"
init: false
host_network: true
privileged:
  - SYS_RAWIO
full_access: true
services:
  - "mqtt:need"
options:
  mqtt_host: ""
  name: "Input Events"
  discovery_prefix: "homeassistant"
  base_topic: ""
  auto_discover: true
  keystates: ["PRESS"]
  devices: []
  enabled_devices: []
  rescan_interval: 5
  cleanup_legacy: true
  log_level: "info"
schema:
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_tls: bool?
  mqtt_tls_ca: str?
  name: str?
  discovery_prefix: str?
  base_topic: str?
  topic: str?
  auto_discover: bool
  filter_keys_only: bool?
  keystates:
    - "list(PRESS|RELEASE|REPEAT)"
  devices:
    - str?
  enabled_devices:
    - str?
  state_file: str?
  rescan_interval: "int(0,)?"
  cleanup_legacy: bool?
  log_level: list(debug|info|warning|error)
panel_icon: "mdi:remote"
panel_title: "evmqtt"
